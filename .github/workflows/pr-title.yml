name: PR title

on:
  pull_request:
    branches:
      - main
    # synchronize keeps the check on the latest commit.
    types:
      - opened
      - edited
      - reopened
      - synchronize

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  commitlint:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'
          cache: 'npm'
      - name: Install
        run: npm ci --ignore-scripts
      - name: Lint PR title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          if output=$(printf '%s\n' "$PR_TITLE" | node_modules/.bin/commitlint --no-color 2>&1); then
            exit 0
          fi
          printf '%s\n' "$output"
          reasons=$(printf '%s\n' "$output" | grep -E '^[^a-zA-Z].*\[[a-z-]+\]$' |
            sed 's/^[^a-zA-Z]*//' | sed ':a;N;$!ba;s/\n/%0A/g') || true
          echo "::error title=PR title::${reasons}%0A%0AEdit the PR title to match, e.g. \"fix: report errors thrown in before hooks\", and this check re-runs."
          exit 1
